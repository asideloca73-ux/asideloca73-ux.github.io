<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de Literatura Argentina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Modal de Contraseña para Editor -->
    <div id="passwordModal" class="modal hidden">
        <div class="modal-content">
            <h2>🔐 Acceso al Editor</h2>
            <p>Ingresa la contraseña para editar las bitácoras</p>
            <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="off">
            <div class="modal-buttons">
                <button onclick="verificarContraseña()">Acceder</button>
                <button onclick="cerrarModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Panel del Copilot -->
    <div id="copilotPanel" class="copilot-panel hidden">
        <div class="copilot-header">
            <h3>🤖 Claude Copilot</h3>
            <button onclick="cerrarCopilot()" class="close-btn">✕</button>
        </div>
        <div id="copilotChat" class="copilot-chat"></div>
        <div class="copilot-input-area">
            <input type="text" id="copilotInput" placeholder="Pregunta al Copilot..." autocomplete="off">
            <button id="btnEnviarCopilot" onclick="enviarMensajeCopilot()">Enviar</button>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div id="mainContent">
        <!-- Header -->
        <header id="header" class="header">
            <div class="header-content">
                <h1>📚 Bitácora Estética y Sensorial</h1>
                <p>Literatura Argentina II</p>
            </div>
            <div class="header-buttons">
                <button id="btnLector" onclick="cambiarModo('lector')" class="btn-mode active">📖 Lector</button>
                <button id="btnEditor" onclick="abrirEditor()" class="btn-mode">✏️ Editor</button>
            </div>
        </header>

        <!-- Modo Lector -->
        <div id="modoLector" class="modo-lector">
            <div class="contenedor-principal">
                <div class="grid-bitacoras" id="gridBitacoras"></div>
            </div>
        </div>

        <!-- Modo Editor -->
        <div id="modoEditor" class="modo-editor hidden">
            <div class="editor-container">
                <div class="editor-toolbar">
                    <h2>✏️ Editar Bitácora</h2>
                    <button onclick="salirEditor()" class="btn-salir">← Volver al Lector</button>
                </div>

                <div class="editor-colores">
                    <div class="color-picker">
                        <label>🎨 Color Principal:</label>
                        <input type="color" id="colorPrincipal" value="#c41e3a" onchange="actualizarColores()">
                    </div>
                    <div class="color-picker">
                        <label>🎨 Color Secundario:</label>
                        <input type="color" id="colorSecundario" value="#ffd700" onchange="actualizarColores()">
                    </div>
                    <div class="color-picker">
                        <label>🎨 Color de Fondo:</label>
                        <input type="color" id="colorFondo" value="#0a0a0a" onchange="actualizarColores()">
                    </div>
                </div>

                <form id="editForm">
                    <div class="form-group">
                        <label>📚 Selecciona Bitácora:</label>
                        <select id="selectBitacora" onchange="cargarBitacora()">
                            <option value="">-- Selecciona una bitácora --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>📝 Título:</label>
                        <input type="text" id="editTitulo" placeholder="Título de la bitácora">
                    </div>

                    <div class="form-group">
                        <label>📚 Tema:</label>
                        <input type="text" id="editTema" placeholder="Tema principal">
                    </div>

                    <div class="form-group">
                        <label>✍️ Contenido:</label>
                        <textarea id="editContenido" placeholder="Contenido de la bitácora..." rows="10"></textarea>
                    </div>

                    <div class="form-group">
                        <label>🎥 URL de Imagen/Video:</label>
                        <input type="url" id="editMedia" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>

                    <div class="form-group">
                        <label>🔗 Enlaces Adicionales (uno por línea):</label>
                        <textarea id="editEnlaces" placeholder="https://ejemplo.com&#10;https://otro.com" rows="4"></textarea>
                    </div>

                    <div class="editor-buttons">
                        <button type="button" onclick="guardarBitacora()" class="btn-guardar">💾 Guardar</button>
                        <button type="button" onclick="abrirCopilot()" class="btn-copilot">🤖 Copilot</button>
                    </div>

                    <div class="copilot-shortcuts">
                        <div class="shortcut-group">
                            <button type="button" onclick="pedirAyudaRedaccion()" class="btn-shortcut">📝 Mejorar Redacción</button>
                            <button type="button" onclick="corregirTexto()" class="btn-shortcut">✏️ Corregir Texto</button>
                        </div>
                        <div class="shortcut-group">
                            <button type="button" onclick="expandirIdea()" class="btn-shortcut">📖 Expandir Idea</button>
                            <button type="button" onclick="resumirTexto()" class="btn-shortcut">📋 Resumir</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Vista Detallada de Bitácora -->
        <div id="vistaDetallada" class="vista-detallada hidden">
            <button onclick="volverAlGrid()" class="btn-volver">← Volver</button>
            <div class="detalle-container">
                <div class="detalle-header">
                    <h1 id="detalleTitle"></h1>
                    <p id="detalleTema" class="tema-badge"></p>
                </div>
                <div id="detalleMedia" class="detalle-media"></div>
                <div id="detalleContenido" class="detalle-contenido"></div>
                <div id="detalleEnlaces" class="detalle-enlaces"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script src="copilot.js"></script>
</body>
</html>
